[package]
name = "backroom"
version = "0.1.0"
edition = "2021"
description = "A synthesized drum machine inspired by classic early-80s analog drum machines"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "backroom"
path = "src/lib.rs"

[[bin]]
name = "backroom"
path = "src/main.rs"

[dependencies]
cpal = "0.18"
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software"] }

# Same audio route as Plaza: PulseAudio's protocol (pure Rust), which PipeWire
# serves through pipewire-pulse, falling back to ALSA.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] }

# localtime_r for the time-stamped SAVE COPY names.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 3

[build-dependencies]
slint-build = "1.18"
